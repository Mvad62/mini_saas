{% extends "base.html" %}

{% block title %}Регистрация — Mini SaaS для опросов{% endblock %}

{% block navigation %}
  <a href="/login">Войти</a>
{% endblock %}

{% block content %}
  <section class="auth-card">
    <h1>Создать аккаунт</h1>
    <form action="/auth/register" method="post">
      <label for="name">Имя</label>
      <input id="name" name="name" type="text" value="{{ name }}" autocomplete="name" required minlength="1" maxlength="120">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" value="{{ email }}" autocomplete="email" required maxlength="320">
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="72">
      <button type="submit">Зарегистрироваться</button>
    </form>
    <p>Уже есть аккаунт? <a href="/login">Войти</a></p>
  </section>
{% endblock %}
