{% extends "base.html" %}

{% block title %}Вход — Mini SaaS для опросов{% endblock %}

{% block navigation %}
  <a href="/auth/register">Зарегистрироваться</a>
{% endblock %}

{% block content %}
  <section class="auth-card">
    <h1>Вход</h1>
    <form action="/auth/login" method="post">
      <input type="hidden" name="next" value="{{ next_url }}">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" value="{{ email }}" autocomplete="email" required maxlength="320">
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="72">
      <button type="submit">Войти</button>
    </form>
    <p>Нет аккаунта? <a href="/auth/register">Зарегистрироваться</a></p>
  </section>
{% endblock %}
