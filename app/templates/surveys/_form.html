<form class="survey-form" action="{{ action }}" method="post">
  <label for="survey-title">Название опроса</label>
  <input id="survey-title" name="title" type="text" value="{{ form.title }}" required maxlength="200">

  <label for="survey-description">Описание</label>
  <textarea id="survey-description" name="description" rows="3" maxlength="5000">{{ form.description }}</textarea>

  <section class="question-section">
    <div class="section-heading">
      <h2>Вопросы</h2>
      <button class="button button-secondary" type="button" data-add-question>Добавить вопрос</button>
    </div>
    <div class="question-list" data-questions>
      {% for question in form.questions %}
        <fieldset class="question-card" data-question>
          <div class="section-heading">
            <strong class="question-heading">Вопрос <span data-question-number>{{ loop.index }}</span></strong>
            <button class="button button-danger" type="button" data-remove-question>Удалить</button>
          </div>
          <label data-label-for="text">Текст вопроса</label>
          <input data-field="text" type="text" value="{{ question.text }}" required maxlength="2000">
          <label data-label-for="type">Тип ответа</label>
          <select data-field="type">
            <option value="single_choice" {% if question.type == "single_choice" %}selected{% endif %}>Один вариант</option>
            <option value="multiple_choice" {% if question.type == "multiple_choice" %}selected{% endif %}>Несколько вариантов</option>
            <option value="text" {% if question.type == "text" %}selected{% endif %}>Текстовый ответ</option>
          </select>
          <div class="option-fields" data-option-fields>
            <label data-label-for="options">Варианты ответа (каждый с новой строки, минимум два)</label>
            <textarea data-field="options" rows="4" placeholder="Например:&#10;Да&#10;Нет">{{ question.options }}</textarea>
            <div class="option-actions">
              <button class="button button-secondary" type="button" data-add-option>Добавить вариант</button>
              <button class="button button-secondary" type="button" data-remove-option>Удалить последний вариант</button>
            </div>
          </div>
          <label class="checkbox-label">
            <input data-field="required" type="checkbox" {% if question.is_required %}checked{% endif %}>
            Обязательный вопрос
          </label>
        </fieldset>
      {% endfor %}
    </div>
  </section>
  <button type="submit">{{ submit_label }}</button>
</form>

<template id="question-template">
  <fieldset class="question-card" data-question>
    <div class="section-heading">
      <strong class="question-heading">Вопрос <span data-question-number></span></strong>
      <button class="button button-danger" type="button" data-remove-question>Удалить</button>
    </div>
    <label data-label-for="text">Текст вопроса</label>
    <input data-field="text" type="text" required maxlength="2000">
    <label data-label-for="type">Тип ответа</label>
    <select data-field="type">
      <option value="single_choice">Один вариант</option>
      <option value="multiple_choice">Несколько вариантов</option>
      <option value="text">Текстовый ответ</option>
    </select>
    <div class="option-fields" data-option-fields>
      <label data-label-for="options">Варианты ответа (каждый с новой строки, минимум два)</label>
      <textarea data-field="options" rows="4" placeholder="Например:&#10;Да&#10;Нет"></textarea>
      <div class="option-actions">
        <button class="button button-secondary" type="button" data-add-option>Добавить вариант</button>
        <button class="button button-secondary" type="button" data-remove-option>Удалить последний вариант</button>
      </div>
    </div>
    <label class="checkbox-label">
      <input data-field="required" type="checkbox" checked>
      Обязательный вопрос
    </label>
  </fieldset>
</template>
<script src="{{ url_for('static', path='/js/survey-builder.js') }}" defer></script>
